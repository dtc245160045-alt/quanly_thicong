services:
  db:
    image: mysql:8.0
    container_name: quanly_thicong_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: quanly_thicong
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: .
    container_name: quanly_thicong_backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=secret
      - DB_NAME=quanly_thicong
      - BACKUP_DIR=/app/backups
    volumes:
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: quanly_thicong_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  db_data:
